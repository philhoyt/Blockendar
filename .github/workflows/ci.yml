name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same branch cancels the first: these jobs boot Docker and
# a browser, so letting superseded runs finish costs minutes for no information.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit

      - name: Lint (phpcs)
        run: vendor/bin/phpcs

      # Brain Monkey unit tests: no WordPress is loaded, so these are safe to run
      # on every PHP version in the matrix. Anything touching capabilities, REST
      # or the database lives in the integration job below instead.
      - name: Unit tests (Brain Monkey)
        run: vendor/bin/phpunit

  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Unit tests (Jest)
        run: npm run test:js

      - name: Build
        run: npm run build

  wordpress:
    name: Integration + E2E
    runs-on: ubuntu-latest

    env:
      # playwright.config.js defaults to port 8890, which comes from
      # .wp-env.override.json — a local workaround for machines where another
      # Docker project already holds 8888. That file is gitignored, so wp-env
      # boots on its own default here and Playwright has to be pointed at it.
      WP_PORT: '8888'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install JS dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # Blocks register from build/, not src/, so both suites below test stale
      # code unless this runs first.
      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npm run env:start

      # Fail here, in seconds and by name, rather than as eighty Playwright
      # timeouts several minutes later, if the site is not where the tests think.
      - name: Wait for WordPress
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${WP_PORT}/" > /dev/null; then
              echo "WordPress is responding on port ${WP_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "No response from http://localhost:${WP_PORT}/ after 60s."
          echo "Ports wp-env actually published:"
          docker ps --format '{{.Names}}\t{{.Ports}}'
          exit 1

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # E2E must come before the PHPUnit integration suite: that suite's
      # bootstrap reinstalls the tests site and leaves it with no active theme or
      # plugin, so a Playwright run after it fails at the first block insert.
      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Integration tests (PHPUnit against real WordPress)
        run: npm run test:integration

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

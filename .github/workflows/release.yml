name: Release

on:
  push:
    tags:
      # Lowercase only, deliberately. Plugin Update Checker normalises a tag with
      # ltrim( $tag, 'v' ), which does not strip an uppercase V — a tag like
      # V1.1.0 stays "V1.1.0" and version_compare() then ranks it BELOW the
      # installed version, so no update is ever offered.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      # Renamed so it sorts AFTER blockendar.zip in GitHub's asset list.
      # PUC takes assets[0] when no name filter is set, and installs still
      # running the unfiltered 1.5.0 code would otherwise pull the demo zip.
      # The zip's internal root folder stays blockendar-demo/, so the plugin
      # still installs to wp-content/plugins/blockendar-demo/.
      - name: Create demo plugin zip
        run: |
          npm run plugin-zip:demo
          mv demo-plugin/blockendar-demo.zip demo-plugin/blockendar_demo.zip

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1} found && /^= [0-9]/ && !/^= ${VERSION} =/{exit} found{print}" readme.txt > changelog_body.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blockendar.zip
            demo-plugin/blockendar_demo.zip
            readme.txt
          body_path: changelog_body.txt
